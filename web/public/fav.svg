<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <style>
      .layer {
        mix-blend-mode: multiply;
        opacity: 0.9;
      }
    </style>
  </defs>
  
  <!-- Transparent Background is default in SVG -->

  <!-- 1. Left Backbone (Dark Blue) -->
  <polygon class="layer" points="20,30 45,40 45,60 20,70" fill="#2a5d84" />
  
  <!-- 2. Bottom Left Fold (Yellow) -->
  <polygon class="layer" points="20,70 45,53 60,68 35,85" fill="#e2b453" />
  
  <!-- 3. Top Left Fold (Medium Blue) -->
  <polygon class="layer" points="20,30 35,15 60,32 45,47" fill="#3b8599" />
  
  <!-- 4. Bottom Right Point (Orange) -->
  <polygon class="layer" points="40,88 60,68 85,68 65,88" fill="#df7850" />
  
  <!-- 5. Top Right Point (Teal) -->
  <polygon class="layer" points="40,12 65,12 85,32 60,32" fill="#4eb2a8" />
  
</svg>
